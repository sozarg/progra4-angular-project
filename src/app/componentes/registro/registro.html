<main class="contenedor">
  <h1>Registro</h1>

  <div class="campo">
    <label for="nombreRegistro">Nombre</label>
    <input id="nombreRegistro" type="text" [(ngModel)]="usuario.nombre">
  </div>

  <div class="campo">
    <label for="claveRegistro">Clave</label>
    <input id="claveRegistro" type="password" [(ngModel)]="usuario.clave">
  </div>

  <div class="botones">
    <button type="button" (click)="registrar()">Registrar</button>
  </div>

  <p class="mensaje">{{ mensaje }}</p>
</main>
